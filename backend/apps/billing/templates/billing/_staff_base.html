<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{% block title %}Invoices{% endblock %}</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f6f7f9; color: #222; }
  header { background: #1f2937; color: #fff; padding: 12px 24px; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
  th { background: #fafafa; }
  .r { text-align: right; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .draft { background: #fef3c7; color: #92400e; }
  .confirmed { background: #dbeafe; color: #1e40af; }
  .paid { background: #d1fae5; color: #065f46; }
  .cancelled { background: #fee2e2; color: #991b1b; }
  .sent { background: #d1fae5; color: #065f46; }
  .unsent { background: #fef3c7; color: #92400e; }
  .btn { background: #2563eb; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
  .btn.secondary { background: #6b7280; }
  .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; }
  .msg.success { background: #d1fae5; } .msg.error { background: #fee2e2; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select { padding: 6px 8px; font-size: 14px; }
</style>
</head>
<body>
<header><a href="{% url 'billing:invoice_list' %}">Brightloop &middot; Invoices</a></header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
